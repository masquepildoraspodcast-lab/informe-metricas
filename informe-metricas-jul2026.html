<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState } = React;

const C = {
  navy: "#0d1f4e", blue: "#1a3a6b", accent: "#7ec8e3", gold: "#d4a017",
  green: "#0e6e55", bg: "#f4f2ed", white: "#ffffff", text: "#1a1a2e",
  muted: "#6b7280", border: "#e2ddd5",
};

function Stat({ value, label, sub, up, down, big }) {
  return (
    <div style={{ background: C.white, borderRadius: "12px", border: `1px solid ${C.border}`, padding: big ? "20px 22px" : "16px 18px", display: "flex", flexDirection: "column", gap: "4px" }}>
      <p style={{ fontSize: big ? "32px" : "26px", fontWeight: "800", color: C.navy, margin: 0, lineHeight: 1 }}>{value}</p>
      <p style={{ fontSize: "12px", color: C.muted, margin: 0 }}>{label}</p>
      {(up || down) && (<p style={{ fontSize: "12px", color: up ? C.green : "#c0392b", margin: 0, fontWeight: "600" }}>{up ? "▲" : "▼"} {up || down}</p>)}
      {sub && <p style={{ fontSize: "11px", color: C.muted, margin: 0, fontStyle: "italic" }}>{sub}</p>}
    </div>
  );
}
function PlatformHeader({ icon, name, color, bg }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: "10px", padding: "14px 0 10px", borderBottom: `2px solid ${color}`, marginBottom: "16px" }}>
      <span style={{ background: bg, color, width: "32px", height: "32px", borderRadius: "8px", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "16px", fontWeight: "800", flexShrink: 0 }}>{icon}</span>
      <span style={{ fontWeight: "800", fontSize: "16px", color: C.navy, letterSpacing: "-0.3px" }}>{name}</span>
    </div>
  );
}
function BarRow({ label, pct, value, color }) {
  return (
    <div style={{ marginBottom: "8px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "4px" }}>
        <span style={{ fontSize: "13px", color: C.text }}>{label}</span>
        <span style={{ fontSize: "13px", fontWeight: "600", color: C.navy }}>{value || `${pct}%`}</span>
      </div>
      <div style={{ background: "#f0ece4", borderRadius: "4px", height: "6px" }}>
        <div style={{ width: `${pct}%`, background: color, height: "6px", borderRadius: "4px" }} />
      </div>
    </div>
  );
}
function Tag({ children, color = C.navy, bg }) {
  return (<span style={{ background: bg || `${color}18`, color, fontSize: "11px", fontWeight: "700", padding: "3px 10px", borderRadius: "20px", letterSpacing: "0.5px", textTransform: "uppercase" }}>{children}</span>);
}
function Insight({ icon, text, type = "positive" }) {
  const colors = { positive: { bg: "#e6f4f0", border: "#0e6e55", icon: "#0e6e55" }, warning: { bg: "#fff8e6", border: "#d4a017", icon: "#d4a017" }, info: { bg: "#e8eef8", border: "#1a3a6b", icon: "#1a3a6b" } };
  const col = colors[type];
  return (
    <div style={{ background: col.bg, border: `1px solid ${col.border}40`, borderLeft: `3px solid ${col.border}`, borderRadius: "8px", padding: "10px 14px", display: "flex", gap: "10px", alignItems: "flex-start", marginBottom: "8px" }}>
      <span style={{ fontSize: "16px", flexShrink: 0, color: col.icon }}>{icon}</span>
      <p style={{ margin: 0, fontSize: "13px", color: C.text, lineHeight: 1.5 }}>{text}</p>
    </div>
  );
}
function DataBadge({ children }) {

}
function Card({ title, sub, children }) {

    <div style={{ background: C.white, borderRadius: "12px", border: `1px solid ${C.border}`, padding: "18px", marginBottom: "16px" }}>

      {sub && <p style={{ fontSize: "12px", color: C.muted, margin: "0 0 14px", fontStyle: "italic" }}>{sub}</p>}

  );
}
