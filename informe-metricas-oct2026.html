  .stat-up { font-size: 12px; color: #0e6e55; font-weight: 600; margin-top: 4px; }

  .insight.positive { background: #e6f4f0; border: 1px solid rgba(14,110,85,0.25); border-left: 3px solid #0e6e55; }

    .hero-grid { grid-template-columns: 1fr 1fr; }

</style>

// Render nav and sections
const nav = document.getElementById('nav');
const content = document.getElementById('content');

sections.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'nav-btn' + (s === 'Resumen' ? ' active' : '');
  btn.textContent = s;
  btn.onclick = () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
    document.getElementById('sec-' + s).classList.add('active');
  };
  nav.appendChild(btn);

  const div = document.createElement('div');
  div.className = 'section' + (s === 'Resumen' ? ' active' : '');
  div.id = 'sec-' + s;
  div.innerHTML = sectionContent[s] || '';
  content.appendChild(div);
});
